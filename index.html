<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AEON — a living universe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='3' fill='white'/></svg>">
<style>
  :root{
    --ink: rgba(255,255,255,.92);
    --ink-dim: rgba(255,255,255,.55);
    --ink-faint: rgba(255,255,255,.28);
    --hairline: rgba(255,255,255,.14);
    --accent: #9ecbff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; }
  body{
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #app{ position:fixed; inset:0; background:#000; }
  #app canvas{ display:block; }

  /* ------- splash ------- */
  #splash{
    position:fixed; inset:0; z-index:40; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; transition: opacity 1.4s ease; pointer-events:none;
  }
  #splash h1{
    font-weight:200; font-size: clamp(28px, 5vw, 54px);
    letter-spacing: .55em; text-indent:.55em; color:var(--ink);
  }
  #splash p{
    font-weight:300; font-size:11px; letter-spacing:.34em; text-indent:.34em;
    text-transform:uppercase; color:var(--ink-faint);
  }
  #splash.gone{ opacity:0; }

  /* ------- HUD scaffolding (populated by hud.js) ------- */
  .hud{ position:fixed; z-index:20; pointer-events:none; }
  .hud button{ pointer-events:auto; }
  #crumbs{
    top:22px; left:26px; display:flex; align-items:center; gap:10px;
    font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:var(--ink-dim);
    flex-wrap: wrap; max-width: 70vw;
  }
  #crumbs .crumb{ pointer-events:auto; cursor:pointer; transition:color .25s; background:none; border:none;
    color:var(--ink-dim); font:inherit; letter-spacing:inherit; text-transform:inherit; padding:0; }
  #crumbs .crumb:hover{ color:var(--ink); }
  #crumbs .crumb.here{ color:var(--ink); cursor:default; }
  #crumbs .sep{ color:var(--ink-faint); font-size:9px; }

  #stats{
    left:26px; bottom:24px; font-size:11px; line-height:1.9;
    letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  #stats b{ font-weight:400; color:var(--ink); }

  #hints{
    bottom:24px; left:50%; transform:translateX(-50%);
    font-size:10px; letter-spacing:.3em; text-indent:.3em; text-transform:uppercase;
    color:var(--ink-faint); white-space:nowrap; transition:opacity 1.2s ease;
    text-align:center;
  }
  #hints.faded{ opacity:0; }

  #timectl{
    right:26px; bottom:22px; display:flex; align-items:center; gap:14px;
    font-size:11px; letter-spacing:.2em; color:var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  #timectl button{
    background:none; border:1px solid var(--hairline); color:var(--ink-dim);
    width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:11px;
    transition: border-color .25s, color .25s; display:flex; align-items:center; justify-content:center;
  }
  #timectl button:hover{ border-color:var(--ink-dim); color:var(--ink); }
  #timectl .readout{ min-width:120px; text-align:right; text-transform:uppercase; }

  #science{
    top:20px; right:26px; display:flex; flex-direction:column; align-items:flex-end; gap:12px;
  }
  #science > button{
    background:none; border:1px solid var(--hairline); color:var(--ink-dim);
    width:30px; height:30px; border-radius:50%; cursor:pointer;
    font-size:13px; font-style:italic; font-family: Georgia, serif;
    transition: border-color .25s, color .25s;
  }
  #science > button:hover{ border-color:var(--ink-dim); color:var(--ink); }
  #science .note{
    width:min(330px, 78vw); font-size:12px; font-weight:300; line-height:1.75;
    color:var(--ink-dim); text-align:left; border-right:1px solid var(--hairline);
    padding:2px 16px 2px 0; letter-spacing:.02em;
    opacity:0; transform:translateY(-6px); transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }
  #science .note.open{ opacity:1; transform:none; }
  #science .note em{ color:var(--ink); font-style:normal; }
  #science .logpanel.open{ pointer-events:auto; }
  .lb-mark{
    background:none; border:1px solid var(--hairline); border-radius:2px; cursor:pointer;
    color:var(--ink-dim); font:inherit; font-size:10px; letter-spacing:.22em; text-indent:.22em;
    text-transform:uppercase; padding:7px 12px; margin-bottom:10px; transition:border-color .25s, color .25s;
  }
  .lb-mark:hover{ border-color:var(--accent); color:var(--ink); }
  .lb-row{ display:flex; align-items:baseline; gap:8px; }
  .lb-go{
    background:none; border:none; cursor:pointer; flex:1; text-align:left;
    color:var(--ink-dim); font:inherit; font-size:11.5px; padding:3px 0; transition:color .2s;
  }
  .lb-go:hover{ color:var(--accent); }
  .lb-x{ background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:13px; }
  .lb-x:hover{ color:#ff8585; }
  .lb-empty{ font-size:11px; color:var(--ink-faint); font-style:italic; }

  #card{
    left:26px; top:50%; transform:translateY(-50%);
    width:min(280px, 70vw); padding-left:16px; border-left:1px solid var(--hairline);
    opacity:0; transition:opacity .45s ease; pointer-events:none;
  }
  #card.open{ opacity:1; }
  #card h2{ font-weight:300; font-size:19px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:2px; }
  #card .kind{ font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); margin-bottom:14px; }
  #card dl{ display:grid; grid-template-columns:auto 1fr; gap:3px 16px;
    font-size:11px; letter-spacing:.08em; font-variant-numeric:tabular-nums; }
  #card dt{ color:var(--ink-faint); text-transform:uppercase; letter-spacing:.18em; font-size:10px; padding-top:1px; }
  #card dd{ color:var(--ink-dim); text-align:right; }
  #card .flavor{ margin-top:14px; font-size:11.5px; font-weight:300; line-height:1.7; color:var(--ink-faint); font-style:italic; }
  #card .act{ margin-top:14px; }
  #card .act button{
    background:none; border:1px solid var(--hairline); border-radius:2px; cursor:pointer;
    color:var(--ink-dim); font:inherit; font-size:10px; letter-spacing:.3em; text-indent:.3em;
    text-transform:uppercase; padding:8px 14px; transition:border-color .25s, color .25s;
  }
  #card .act button:hover{ border-color:var(--accent); color:var(--ink); }

  /* ------- warp overlay ------- */
  #warp{
    position:fixed; inset:0; z-index:30; background:#000; opacity:0; pointer-events:none;
    transition: opacity .28s ease;
  }
  #warp.on{ opacity:1; }

  #veil{
    position:fixed; inset:0; z-index:28; opacity:0; pointer-events:none;
  }
  #vignette{
    position:fixed; inset:0; z-index:10; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.55) 100%);
  }

  @media (max-width:640px){
    #card{ display:none; }
    #hints{ display:none; }
  }

  /* ------- atlas & controls cards ------- */
  .at-sec{
    margin:10px 0 4px; padding-top:8px; border-top:1px solid var(--hairline);
    font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-faint);
  }
  .logpanel .lb-go i{ color:var(--ink-faint); font-style:italic; }
  .controlscard{ line-height:2.05; }
  .controlscard b{
    display:block; margin:10px 0 2px; font-size:10px; letter-spacing:.3em;
    text-transform:uppercase; color:var(--ink-faint); font-weight:400;
  }
  .controlscard b:first-child{ margin-top:0; }

  /* ------- touch controls (built by hud.js on coarse pointers) ------- */
  #app canvas{ touch-action:none; }
  #touch{ position:fixed; inset:0; pointer-events:none; display:none; z-index:22;
    opacity:1; transition:opacity .6s ease; }
  #touch.dim{ opacity:.22; }
  body.coarse #touch{ display:block; }
  /* the keyboard's hints and the thumb's controls never share a bottom edge */
  body.coarse #hints{ display:none; }
  #stick{ position:absolute; left:18px; bottom:calc(24px + env(safe-area-inset-bottom));
    width:92px; height:92px; border-radius:50%;
    border:1px solid var(--hairline); background:rgba(12,16,22,.28);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    pointer-events:auto; touch-action:none; }
  #knob{ position:absolute; left:50%; top:50%; width:38px; height:38px; margin:-19px 0 0 -19px;
    border-radius:50%; background:rgba(255,255,255,.15); border:1px solid var(--ink-faint);
    transition:background .2s; }
  #stick:active #knob{ background:rgba(158,203,255,.3); }
  #vslide{ position:absolute; right:14px; bottom:calc(96px + env(safe-area-inset-bottom));
    width:36px; height:128px; border-radius:20px;
    border:1px solid var(--hairline); background:rgba(12,16,22,.28);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    pointer-events:auto; touch-action:none; }
  #vknob{ position:absolute; left:50%; top:50%; width:28px; height:28px; margin:-14px 0 0 -14px;
    border-radius:50%; background:rgba(255,255,255,.15); border:1px solid var(--ink-faint); }
  #vslide::before, #vslide::after{
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:10px; color:var(--ink-faint); pointer-events:none; }
  #vslide::before{ content:'▲'; top:7px; }
  #vslide::after{ content:'▼'; bottom:7px; }
  #tbtns{ position:absolute; right:12px; bottom:calc(20px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:flex-end; gap:8px; pointer-events:auto; }
  #tbtns button{ border-radius:50%; border:1px solid var(--hairline);
    background:rgba(12,16,22,.32); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    color:var(--ink); font:inherit; touch-action:none; }
  #tbtns button.big{ width:46px; height:46px; font-size:19px;
    border-color:var(--ink-faint); background:rgba(20,30,44,.42); align-self:flex-end; }
  #tbrow{ display:flex; gap:6px; }
  #tbrow button{ width:36px; height:36px; font-size:13px; }
  #tbtns button:active{ background:rgba(158,203,255,.28); }
  #touchhelp{ position:absolute; right:82px; bottom:calc(30px + env(safe-area-inset-bottom));
    max-width:260px; padding:12px 15px;
    font-size:11px; line-height:2.05; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-dim); background:rgba(8,11,15,.72);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--hairline); border-radius:10px; display:none; pointer-events:auto; }
  #touchhelp b{ color:var(--ink); }
  #touchhelp.open{ display:block; }
  @media (pointer:coarse) and (max-width:900px){
    #stats{ display:none; }
    #crumbs{ max-width:86vw; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="warp"></div>
  <div id="splash">
    <h1>AEON</h1>
    <p>a living universe</p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

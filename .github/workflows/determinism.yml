# §2.3's other half — the clause nothing could ask from one machine.
#
#   "Same seed + same code = same universe on every machine, forever."
#                                        ^^^^^^^^^^^^^^^^^^^^^^^^^^^
#
# `tools/repeat.js` proves one machine renders a URL the same way twice.
# `tools/invariants.js` proves no un-seeded entropy has crept into `src/`.
# `constitution.yml` proves the generators have not drifted since the baseline.
# Not one of those can see the failure this workflow exists for: a generator
# that gives one answer on Linux and another on macOS breaks every shared URL in
# the project, and passes all three green.
#
# §2.3 makes a seeded universe a permanent public address. An address that
# resolves differently depending on who types it is not one.
#
# ---------------------------------------------------------------------------
# Two matrices, and only one of them is a gate
#
# `platforms` runs the same Node on Linux, macOS and Windows and requires all
# three digests to be identical. That is §2.3's claim as stated, on today's
# engine, and it is a hard failure.
#
# `engines` runs three Node versions on one platform and does *not* fail the
# build. The reason is in `tools/digest.js`'s header: `Math.sin`, `Math.pow` and
# `Math.exp` are not specified to the last bit by IEEE-754 or by ECMA-262. V8
# ships its own fdlibm port so the answer does not vary by *platform* — which is
# why `platforms` passes — but that is a property of the engine, and two engine
# versions are two implementations. §9.6 derives the sky stops through `exp()`
# in a tight loop; §M1 integrates the growth factor with `pow()`. A one-ulp
# difference there moves a sky colour by less than a 255th and moves nothing
# anyone can see. It also moves this digest.
#
# So `engines` reports rather than gates, and writes its answer into the run
# summary. If the digest turns out to survive an engine bump, that is worth
# knowing. If it does not, §2.3's "forever" has a footnote, and the right
# response is to write the footnote — not to switch off the check that found it.
#
# ---------------------------------------------------------------------------
# Cadence
#
# Weekly, on demand, and on any pull request that touches the generators.
# macOS runners bill at ten times Linux and Windows at two, which is worth
# nothing on a job that finishes in seconds and worth avoiding on every push to
# every branch.

name: determinism

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/digest.js'
      - 'docs/captures/digest.json'
      - '.github/workflows/determinism.yml'
  schedule:
    # Mondays, 06:00 UTC — before anyone looks, after nothing has happened
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # pinned exactly — see the note in `platforms`
  NODE: '22.23.2'

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # the gate: one engine, three operating systems, one answer

  platforms:
    # (the version is spelled out here because the `env` context is not
    #  available in a job name — only github, needs, strategy, matrix and vars)
    name: ${{ matrix.os }} · node 22.23.2, pinned
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # every row runs, so a mismatch reports *which* platform disagreed rather
      # than stopping at the first one and leaving the shape of it unknown
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # An exact version, not '22', and the first run is why. `node-version:
      # '22'` resolves to whatever each runner image happens to carry, and it
      # gave Linux and Windows 22.23.2 while macOS got 22.23.1 — so when the
      # digests disagreed there were two variables in the room, architecture and
      # a patch release, and the run could not say which one moved the universe.
      # A matrix whose whole purpose is to isolate one variable has to isolate it.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}

      - name: the generation path, as one SHA-256
        run: node tools/digest.js --json digest-${{ matrix.os }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.json

  compare:
    name: every machine agrees (§2.3)
    needs: platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      # ---------------------------------------------------------------------
      # This reports. It does not gate, and that is not the shape it was built
      # in — it is the shape its first run argued it into.
      #
      # The first run said:
      #
      #   fc470bc5a2e0a2a1  darwin/arm64  V8 12.4.254.21-node.56
      #   fea8833953d8ca97  linux/x64     V8 12.4.254.21-node.56
      #   fea8833953d8ca97  win32/x64     V8 12.4.254.21-node.56
      #
      # Linux and Windows agree bit for bit. macOS, on the *same V8*, does not
      # — in `zeldovich`, `starlight` and `tree`, the three transcendental-heavy
      # suites. §2.3 says "the same universe on every machine, forever", and on
      # the evidence that is not true today.
      #
      # Which means a red X here is not a defect anybody introduced. It is a
      # standing property of the codebase, and a gate that is permanently red
      # for a standing property is the thing this workflow's own header warns
      # about: it trains everyone to skim past red.
      #
      # CLAUDE.md §12 says to stop and ask when an invariant in §2 would have to
      # bend. This one bends either way — relax the clause to name an
      # architecture, or change the generators so it holds — and neither is a
      # call CI gets to make. So the comparison runs, the answer goes in the
      # summary and in `docs/notes/ci.md`, and the job's status means only
      # "the comparison ran". Turn the last line back on the day the question
      # is settled.
      # ---------------------------------------------------------------------
      - name: compare, and say what moved
        run: |
          node -e '
            const { readdirSync, readFileSync, appendFileSync } = require("node:fs");
            const files = readdirSync("digests").filter((f) => f.endsWith(".json")).sort();
            if (files.length < 2) { console.error("only " + files.length + " digest(s) — nothing to compare"); process.exit(2); }
            const runs = files.map((f) => JSON.parse(readFileSync("digests/" + f, "utf8")));
            const where = (r) => `${r.machine.platform}/${r.machine.arch}`;
            const out = [];
            out.push("### §2.3 · the same universe on every machine");
            out.push("");
            out.push("| machine | node | V8 | digest |");
            out.push("|---|---|---|---|");
            for (const r of runs) {
              out.push(`| ${where(r)} | ${r.machine.node} | \`${r.machine.v8}\` | \`${r.sha256.slice(0, 16)}\` |`);
            }
            // the reference is the digest the most machines produced, not the
            // one that sorts first: "1 of 3 disagrees with x64" is the finding,
            // and "2 of 3 disagree with arm64" is the same fact told backwards
            const tally = new Map();
            for (const r of runs) tally.set(r.sha256, (tally.get(r.sha256) || 0) + 1);
            const winner = [...tally.entries()].sort((a, b) => b[1] - a[1])[0][0];
            const first = runs.find((r) => r.sha256 === winner);
            const odd = runs.filter((r) => r.sha256 !== winner);
            out.push("");
            if (!odd.length) {
              out.push(`**${runs.length} machines, one universe.** ${first.samples} samples across ${Object.keys(first.suites).length} suites.`);
            } else {
              out.push(`**${odd.length} of ${runs.length} machines disagree with ${where(first)}.**`);
              out.push("");
              out.push("| machine | suites that moved |");
              out.push("|---|---|");
              for (const r of odd) {
                const moved = Object.keys(first.suites).filter((n) => first.suites[n]?.sha256 !== r.suites[n]?.sha256);
                out.push(`| ${where(r)} | ${moved.join(", ") || "(the roll-up only)"} |`);
              }
              out.push("");
              out.push("Reported, not gated — see `docs/notes/ci.md`, \"The footnote §2.3 turned out to need\".");
            }
            const text = out.join("\n");
            console.log(text);
            if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + "\n");
          '

  # -------------------------------------------------------------------------
  # the report: three engines, one operating system, no gate

  engines:
    name: node ${{ matrix.node }} (reported, not gated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # This job is green whatever it finds, and that is the design rather than
      # a concession. Its first real run reported node 24 as a red X, which is
      # precisely the outcome the header above says to avoid: a check that goes
      # red for something nobody did teaches everyone to skim past red. The
      # answer belongs in the run summary, where it is read as information; the
      # job's own status should mean "the comparison ran".
      #
      # It fails only if the digest cannot be computed at all, which is a broken
      # tool and a real red X.
      - name: digest, per suite, against the committed baseline
        run: |
          node tools/digest.js --json engine-digest.json
          node -e '
            const { readFileSync } = require("node:fs");
            const now = JSON.parse(readFileSync("engine-digest.json", "utf8"));
            const base = JSON.parse(readFileSync("docs/captures/digest.json", "utf8"));
            const names = Object.keys(base.suites);
            const moved = names.filter((n) => base.suites[n]?.sha256 !== now.suites[n]?.sha256);
            const out = [];
            out.push(`### node ${now.machine.node} · V8 \`${now.machine.v8}\``);
            out.push("");
            out.push(moved.length
              ? `**${moved.length} of ${names.length} suites differ** from the baseline (${base.machine.node}, V8 \`${base.machine.v8}\`).`
              : `All ${names.length} suites match the baseline (${base.machine.node}, V8 \`${base.machine.v8}\`).`);
            out.push("");
            out.push("| suite | baseline | here | |");
            out.push("|---|---|---|---|");
            for (const n of names) {
              const a = (base.suites[n]?.sha256 || "").slice(0, 12);
              const b = (now.suites[n]?.sha256 || "").slice(0, 12);
              out.push(`| ${n} | \`${a}\` | \`${b}\` | ${a === b ? "held" : "**moved**"} |`);
            }
            if (moved.length) {
              out.push("");
              out.push("This is not a determinism leak in AEON. See `docs/notes/ci.md`.");
            }
            require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
            console.log(out.join("\n"));
          '

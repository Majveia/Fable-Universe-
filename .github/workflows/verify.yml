# The offline half of §7, on every push.
#
# AEON's rigor lives in commands that need no GPU: `tools/verify.js` computes
# every CPU-decidable claim a second, independent way (§7.3), and
# `tools/parse.js` checks that all 72 modules parse and that raw shaders
# declare the attributes GLSL will not give them. Together they take about 75
# seconds and need nothing installed, because §2.2 means this project has no
# dependencies to install.
#
# ---------------------------------------------------------------------------
# What this does NOT do, and must never claim to
#
# GitHub's runners have no GPU. §M0 is explicit — "Real GPU, not CI
# SwiftShader" — and `docs/GPU-RUN.md` records four separate runs that lost
# most of their value to software-rasteriser results being read as evidence.
#
# So nothing here scores a frame, and nothing here produces a capture. This
# workflow proves that the arithmetic is right and the code parses. Whether the
# thing is beautiful is a question for `docs/plans/RECKONING.md` Act A, on a
# machine with real silicon, scored blind.
#
# ---------------------------------------------------------------------------
# §2.2 is not violated by this
#
# "Zero dependencies... `python3 -m http.server 8080` must remain sufficient,
# forever." That is an invariant about what it takes to *run* AEON, and it
# still holds: no build step, no bundler, nothing installed into the repo. CI
# is a thing that watches the repo, not a thing the repo needs.

name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# a new push supersedes an in-flight run on the same ref — there is no reason
# to finish measuring a commit nobody is looking at any more
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline suites (§7.3)
    runs-on: ubuntu-latest
    # 30 was not enough once the browser install grew a retry loop: three
    # capped attempts is fifteen minutes of worst case before the suites even
    # start. A job timeout should bound a hang, not a slow-but-working run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci`. There is no package.json, and that is the point (§2.2).

      - name: parse — 72 modules, and the raw-shader lint
        run: node tools/parse.js

      # This is the one that matters. 414 checks, each computing its answer a
      # second, independent way — adaptive quadrature against a lookup table,
      # finite differences against an analytic derivative, the quadtree's own
      # walk against the streaming model built on top of it. A snapshot test
      # proves only that something has not changed, which is the least
      # interesting property it has.
      - name: verify — every CPU-decidable claim (§7.3)
        run: node tools/verify.js

      # The gap the two steps above share, and the reason this one is worth a
      # browser on every push: a module can be valid JavaScript, and every pure
      # function in it can be green, and it can still throw partway through
      # building a scene. That is a black screen, and it has shipped from this
      # repo with CI green — `life.js` referenced a local that had been renamed
      # two hundred lines earlier, which took out every world with a biosphere.
      #
      # No pixel is inspected here. It navigates to each scale and asserts that
      # nothing throws, which is minutes rather than the capture set's hour.
      - name: playwright + chromium
        run: |
          npm i -g playwright
          # No `--with-deps`, and that is the whole fix.
          #
          # It put `apt-get` on the critical path of every run, and a slow
          # Ubuntu mirror then took the job with it -- one PR run sat here 28
          # minutes and died on the job timeout while the identical commit
          # passed on its push run in seven.
          #
          # Capping the attempt made it strictly worse, which is worth
          # recording: `timeout` killed the npx process but not the `apt-get`
          # it had spawned as root, so the orphan kept the dpkg frontend lock
          # and both retries died instantly against a lock the timeout itself
          # had created. A slow-but-succeeding install became a guaranteed
          # failure. Never wrap apt in a timeout you intend to retry around.
          #
          # And it was never needed here. The runner log is explicit: every
          # library Chromium wants -- libnss3, libatk, libgbm, libxkbcommon,
          # the rest -- reports "is already the newest version" on
          # ubuntu-24.04. The only NEW packages `--with-deps` fetched were nine
          # *font* packages, for CJK and Cyrillic text this project never
          # renders: the gates it feeds compile shaders and build scenes
          # offscreen.
          #
          # So: browser only, from Playwright's CDN, which has served 184 MB in
          # about two seconds on every run so far. No apt, no lock, no mirror.
          # If a future runner image does drop a library, Chromium fails to
          # launch and `boot.js` says so in seconds -- a far better failure than
          # a silent half-hour.
          ok=0
          for attempt in 1 2 3; do
            if timeout 600 npx playwright install chromium; then ok=1; break; fi
            echo "playwright install attempt $attempt failed or stalled; retrying"
            sleep 10
          done
          # a loop that exhausts its attempts must fail the job, not fall through
          # into a browser-less run that reports something else as the defect
          [ "$ok" = 1 ] || { echo "playwright install failed after 3 attempts"; exit 1; }

      # The `core` tier: every scale, the cheap world kinds, and one world with
      # a biosphere in flower — the branch that has actually broken. The rest of
      # the world kinds run per pull request in `shaders.yml`, because a
      # biosphere world costs three minutes to build on a software rasteriser
      # and twenty of those is not a gate anyone leaves switched on.
      - name: boot — every scale comes up without throwing
        run: node tools/boot.js --timeout 300

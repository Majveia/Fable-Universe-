# The offline half of §7, on every push.
#
# AEON's rigor lives in commands that need no GPU: `tools/verify.js` computes
# every CPU-decidable claim a second, independent way (§7.3), and
# `tools/parse.js` checks that all 115 modules parse, that raw shaders declare
# the attributes GLSL will not give them, and that no import names an export
# that does not exist. Together they take about eighty seconds and need nothing
# installed, because §2.2 means this project has no dependencies to install.
#
# ---------------------------------------------------------------------------
# Two jobs, not one, and the reason is the 184 MB
#
# This used to be a single job that installed Chromium halfway down. `parse.js`
# is three seconds and `verify.js` is a minute; a broken module therefore
# reported in about a minute, unless somebody had queued a browser download in
# front of it, in which case it reported in five.
#
# Splitting them means the offline suites answer as fast as they can compute,
# and the browser job runs beside them rather than behind them. Neither needs
# the other, so neither should wait for it.
#
# ---------------------------------------------------------------------------
# What this does NOT do, and must never claim to
#
# GitHub's runners have no GPU. §M0 is explicit — "Real GPU, not CI
# SwiftShader" — and `docs/GPU-RUN.md` records four separate runs that lost most
# of their value to software-rasteriser results being read as evidence.
#
# So nothing here scores a frame, and nothing here produces a capture. This
# workflow proves the arithmetic is right, the code parses, and the scenes
# build. Whether the thing is beautiful is a question for
# `docs/plans/RECKONING.md` Act A, on a machine with real silicon, scored blind.
#
# ---------------------------------------------------------------------------
# §2.2 is not violated by this
#
# "Zero dependencies... `python3 -m http.server 8080` must remain sufficient,
# forever." That is an invariant about what it takes to *run* AEON, and it still
# holds: no build step, no bundler, nothing installed into the repo. CI is a
# thing that watches the repo, not a thing the repo needs — and
# `constitution.yml` fails the build if that ever stops being true.

name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a new push supersedes an in-flight run on the same ref — there is no reason
# to finish measuring a commit nobody is looking at any more
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline suites (§7.3)
    runs-on: ubuntu-latest
    # No browser in this job, so nothing here can take minutes. A generous
    # bound on a job that should finish in ninety seconds is still a bound.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci`. There is no package.json, and that is the point (§2.2).

      - name: parse — every module, the raw-shader lint, and the import edges
        run: node tools/parse.js --quiet

      # This is the one that matters. Hundreds of checks, each computing its
      # answer a second, independent way — adaptive quadrature against a lookup
      # table, finite differences against an analytic derivative, the quadtree's
      # own walk against the streaming model built on top of it. A snapshot test
      # proves only that something has not changed, which is the least
      # interesting property it has.
      - name: verify — every CPU-decidable claim (§7.3)
        run: node tools/verify.js

  scenes:
    name: every scale still comes up
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ./.github/actions/chromium

      # Ten seconds, and it covers what a route walk cannot: a shader that only
      # exists when a world is in flower is not built by a flight that happens
      # to land out of season. `shaders.yml` runs this too, as a pre-flight in
      # front of its forty-minute walk; the duplication is deliberate, because
      # that workflow is PR-only and paths-filtered and this one is neither.
      - name: every exported shader pair compiles
        run: node tools/glslcheck.js

      # The gap `parse` and `verify` share, and the reason this is worth a
      # browser on every push: a module can be valid JavaScript, and every pure
      # function in it can be green, and it can still throw partway through
      # building a scene. That is a black screen, and it has shipped from this
      # repo with CI green — `life.js` referenced a local that had been renamed
      # two hundred lines earlier, which took out every world with a biosphere.
      #
      # No pixel is inspected. It navigates to each scale and asserts that
      # nothing throws, which is minutes rather than the capture set's hour.
      - name: boot — every scale, without throwing
        run: node tools/boot.js --timeout 300
